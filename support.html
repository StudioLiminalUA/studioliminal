<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Підтримати — Studio Liminal</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .support-page {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            background: #050505;
            color: #f2f2f2;
            text-align: center;
        }

        .support-content {
            max-width: 650px;
        }

        .support-label {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.65;
            margin-bottom: 25px;
        }

        .support-content h1 {
            font-family: Georgia, serif;
            font-size: clamp(38px, 7vw, 68px);
            font-weight: normal;
            margin: 0 0 30px;
        }

        .support-content p {
            font-size: 18px;
            line-height: 1.7;
            opacity: 0.75;
            margin-bottom: 35px;
        }

        .contact-email {
            display: inline-block;
            color: #f2f2f2;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 1px solid #777;
            padding-bottom: 7px;
        }

        .contact-email:hover {
            opacity: 0.65;
        }

        .back-link {
            display: block;
            margin-top: 60px;
            color: #aaa;
            text-decoration: none;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <main class="support-page">

        <div class="support-content">

            <div class="support-label">
                STUDIO LIMINAL
            </div>

            <h1>Зв’язатися з нами</h1>

            <p>
                Для співпраці, пропозицій та інших звернень
                ви можете написати нам на електронну пошту.
            </p>

            <a
                class="contact-email"
                href="mailto:hello.studioliminal@gmail.com"
            >
                hello.studioliminal@gmail.com
            </a>

            <a class="back-link" href="index/index.html">
                ← На головну
            </a>

        </div>

    </main>

</body>
</html>
